duplicate_transactions:
  issue_code: DUPLICATE_DEDUPED
  affected_source: transactions
  detection: duplicate transaction_id values in transactions feed
  handling_action: DEDUPLICATED_KEEP_FIRST
  keep_rule: earliest transaction_timestamp then earliest ingestion_timestamp
  output_policy: keep_one_record_exclude_duplicate_events
  flag_retained_record: true

orphaned_transactions:
  issue_code: ORPHANED_ACCOUNT
  affected_source: transactions
  detection: transaction account_id not present in valid silver accounts
  handling_action: QUARANTINED
  output_policy: exclude_from_silver_and_gold

amount_type_mismatch:
  issue_code: TYPE_MISMATCH
  affected_source: transactions
  detection: amount value cannot be cast to DECIMAL(18,2) or requires type coercion
  handling_action: CAST_TO_DECIMAL
  target_type: DECIMAL(18,2)
  output_policy: retain_if_cast_succeeds_exclude_if_cast_fails

date_format_inconsistency:
  issue_code: DATE_FORMAT
  affected_source: mixed
  detection: date value not already ISO yyyy-MM-dd but parseable through supported fallback formats
  handling_action: NORMALISED_DATE
  supported_formats:
    - yyyy-MM-dd
    - dd/MM/yyyy
    - unix_epoch_seconds
    - unix_epoch_millis
  output_policy: retain_if_parse_succeeds

currency_variants:
  issue_code: CURRENCY_VARIANT
  affected_source: transactions
  detection: currency value is not exactly ZAR but represents South African Rand
  handling_action: NORMALISED_CURRENCY
  accepted_variants:
    - ZAR
    - zar
    - R
    - rands
    - 710
  target_value: ZAR
  output_policy: retain_and_normalise

null_account_id:
  issue_code: NULL_REQUIRED
  affected_source: accounts
  detection: account_id is null or blank in accounts feed
  handling_action: EXCLUDED_NULL_PK
  output_policy: exclude_from_silver_and_gold